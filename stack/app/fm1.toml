# STACK's build settings (base/tools/build.py)
name = "stack"                 # the build's files: stack.fwsc, stack-X.Y.Z.fwsc, stack_host
id_prefix = "FM-1_58"          # package identity. TEMPORARY for the test builds: to be confirmed against the hubs' lists
usb_manufacturer = "Maker Hip"
usb_product = "STACK FM-1"
o2 = []
gen = ["../tools/gen_version.py {gen}/stack_version.h"]   # the version, from stack/VERSION (app.h)
words = "words.tsv"
ble = false                    # Bluetooth MIDI comes in a later version
# the site and firmware.json
tagline = "eight tracks of sounds, easy to follow"
repo = "https://github.com/perawoga2-coder/stack"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0), from Felucca by Leo Kuroshita (Hugelton Instruments). Sounds: Maker Hip's own Rock kit and FM bank; the Hugelton Sample Pack by Leo Kuroshita (CC0); Versilian Studios VCSL (CC0); audio rendered from Felucca's presets, with thanks to Leo Kuroshita."
author = "Maker Hip"
description = "A test build. Eight tracks, each with one sound from a single list of 78 built-in sounds (drums, bass, keys, pads, leads, effects), all at the same loudness; samples sent from the Burger Studio app come into three slots at the end of the list; the keys play the selected track; four knobs shape it (pitch, a DJ filter, decay, level); a basic 16-step page; a limiter on the output. The tracks and steps are not saved yet."
tags = ["groovebox", "sampler"]
install = "https://github.com/perawoga2-coder/stack"
site = "https://github.com/perawoga2-coder/stack"
screenshot = "docs/screen-play.png"
