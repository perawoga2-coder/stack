# SPDX-License-Identifier: MPL-2.0
# STACK's build settings (base/tools/build.py)
name = "stack"                 # the build's files: stack.fwsc, stack-X.Y.Z.fwsc, stack_host
id_prefix = "FM-1_58"          # package identity. TEMPORARY for the test builds: to be confirmed against the hubs' lists
usb_manufacturer = "Maker Hip"
usb_product = "STACK FM-1"
o2 = []
gen = ["../tools/gen_version.py {gen}/stack_version.h"]   # the version, from stack/VERSION (app.h)
words = "words.tsv"
ble = true                     # Bluetooth MIDI: notes in, the clock in and out (clock.c); samples and audio stay on the cable
ble_stack = "own"              # fm1-base's own Bluetooth stack (bt/): nothing of JieLi's linked
ble_midi_time = true           # Bluetooth MIDI in by the sender's time: the clock in is followed by it
usb_audio_out = false          # the FM-1 is no USB speaker: a tablet keeps its own sound. USB audio in (the FM-1 recorded) stays
midi_stamp = true              # MIDI in stamped where it lands: the clock in is followed by its stamps (clock.c)
# the site and firmware.json
tagline = "eight tracks of sounds, easy to follow"
repo = "https://github.com/perawoga2-coder/stack"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp (MPL-2.0), from Felucca by Leo Kuroshita (Hugelton Instruments). Sounds: Maker Hip's own Rock kit and FM bank; the Hugelton Sample Pack by Leo Kuroshita (CC0); Versilian Studios VCSL (CC0); audio rendered from Felucca's presets, with thanks to Leo Kuroshita."
author = "Maker Hip"
description = "A public beta: not everything is finished, the loop and the app's samples are not kept at power-off; SAVE keeps the song. Eight tracks, each one sound from 69 built-in sounds or a sample sent from the Burger Studio app; per track a DJ filter, envelope, LFO, sample edit, arpeggiator and two effects; a 16-step sequencer with swing, time signature and tempo; a looper on track 8; MIDI clock out or in over USB and Bluetooth MIDI; a limiter on the output. Please report what goes wrong."
tags = ["groovebox", "sampler"]
install = "https://github.com/perawoga2-coder/stack"
site = "https://github.com/perawoga2-coder/stack"
screenshot = "docs/screen-play.png"
