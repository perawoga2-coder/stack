name: STACK firmware

# Builds the STACK .fwsc on GitHub (this session's machine cannot reach JieLi's download hosts).
# fm1-base is fetched at the pinned commit in stack/BASE_COMMITS.txt (unchanged), with its felucca-bsp submodule.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["stack/**", ".github/workflows/stack-firmware.yml"]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: fm1-base (pinned)
        run: |
          BASE=$(sed -n 1p stack/BASE_COMMITS.txt)
          BSP=$(sed -n 2p stack/BASE_COMMITS.txt)
          git clone -q https://github.com/charlesvestal/fm1-base stack/base
          git -C stack/base checkout -q "$BASE"
          git -C stack/base submodule update --init -q
          git -C stack/base/bsp checkout -q "$BSP"
          git -C stack/base log -1 --format='fm1-base %H'
          git -C stack/base/bsp log -1 --format='felucca-bsp %H'

      - name: Toolchain (JieLi clang, AC79 SDK files, Python, screen reader)
        run: |
          for i in 1 2 3; do sh stack/base/tools/setup_toolchain.sh --only uv,python,jieli,ac79-sdk,fm1-reader && break; sleep 30; done

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Simulator tests
        run: |
          cd stack
          base/.venv/bin/python base/tools/build.py app --host
          for t in basic limiter sounds receive keys fx env looper mute clock lfo edit arp ble edit2 glo save save_my city perform dump pages; do app/build/host/stack_host app/tests/$t.txt app/build/host; done

      - name: Build
        id: b
        run: |
          VER=$(tr -d ' \r\n' < stack/VERSION)   # the version is stack/VERSION, nowhere else
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          cd stack
          base/.venv/bin/python base/tools/build.py app --release "$VER"
          ls -la app/build/

      - uses: actions/upload-artifact@v4
        with:
          name: stack-${{ steps.b.outputs.ver }}
          path: |
            stack/app/build/*.fwsc
            stack/app/build/firmware.json

      # (releases come from release.yml: a version tag, built and attested by The Firmware Hub's shared workflow)

      # The web installer (fm1-base's tools/make_site.py). The site's front (install/, the download) is the newest
      # RELEASE (made by release.yml, The Firmware Hub's build); this branch's build is at test/ for the owner to try first.
      - name: Installer site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd stack
          base/.venv/bin/python base/tools/build.py app --web
          TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft --jq '[.[] | select(.isDraft|not) | select(.tagName|test("-test$")|not)][0].tagName')
          REL="${TAG#v}"
          mkdir -p ../rel && gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "stack-$REL.fwsc" -D ../rel --clobber
          # The front (install/, emu/, the manual) is the release's own source at its tag, so the emulator people try
          # is the firmware the front installs (the branch may be ahead of the release: that is test/).
          RELAPP=""
          if git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" && git worktree add -q ../../relsrc "$TAG" \
             && ln -s "$PWD/base" ../../relsrc/stack/base \
             && (cd ../../relsrc/stack && base/.venv/bin/python base/tools/build.py app --web); then
            RELAPP=../../relsrc/stack/app
          else
            # fallback: this branch's app/, with the release's identity (3.98-beta: FM-1_58, since 4.01-beta: FM-1_34)
            echo "front: could not build $TAG's own source; the branch's emulator is used"
            PROD=$(base/.venv/bin/python -c "import sys; sys.path.insert(0,'base/tools'); import make_site; print(make_site.product_of(open(sys.argv[1],'rb').read()))" "../rel/stack-$REL.fwsc")
            RELAPP=app
            if ! grep -q "^id_prefix = \"${PROD%??????}\"" app/fm1.toml; then
              rm -rf ../app-rel && cp -r app ../app-rel
              sed -i "s|^id_prefix = \"[^\"]*\"|id_prefix = \"${PROD%??????}\"|" ../app-rel/fm1.toml
              RELAPP=../app-rel
            fi
          fi
          echo "front: $REL (app: $RELAPP)"
          base/.venv/bin/python base/tools/make_site.py "$RELAPP" "../rel/stack-$REL.fwsc" "$REL" ../site
          base/.venv/bin/python base/tools/make_site.py app "app/build/stack-${{ steps.b.outputs.ver }}.fwsc" "${{ steps.b.outputs.ver }}" ../site-test
          mv ../site-test ../site/test
          echo "front: $REL   test/: ${{ steps.b.outputs.ver }}"
          ls ../site ../site/test

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
