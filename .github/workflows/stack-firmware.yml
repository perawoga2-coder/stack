name: STACK firmware

# Builds the STACK .fwsc on GitHub (this session's machine cannot reach JieLi's download hosts).
# fm1-base is fetched at the pinned commit in stack/BASE_COMMITS.txt (unchanged), with its felucca-bsp submodule.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["stack/**", ".github/workflows/stack-firmware.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: fm1-base (pinned)
        run: |
          BASE=$(sed -n 1p stack/BASE_COMMITS.txt)
          BSP=$(sed -n 2p stack/BASE_COMMITS.txt)
          git clone -q https://github.com/charlesvestal/fm1-base stack/base
          git -C stack/base checkout -q "$BASE"
          git -C stack/base submodule update --init -q
          git -C stack/base/bsp checkout -q "$BSP"
          git -C stack/base log -1 --format='fm1-base %H'
          git -C stack/base/bsp log -1 --format='felucca-bsp %H'

      - name: Toolchain (JieLi clang, AC79 SDK files, Python, screen reader)
        run: |
          for i in 1 2 3; do sh stack/base/tools/setup_toolchain.sh --only uv,python,jieli,ac79-sdk,fm1-reader && break; sleep 30; done

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Simulator tests
        run: |
          cd stack
          base/.venv/bin/python base/tools/build.py app --host
          for t in basic limiter sounds receive keys fx env looper mute clock lfo; do app/build/host/stack_host app/tests/$t.txt app/build/host; done

      - name: Build
        id: b
        run: |
          VER=$(tr -d ' \r\n' < stack/VERSION)   # the version is stack/VERSION, nowhere else
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          cd stack
          base/.venv/bin/python base/tools/build.py app --release "$VER"
          ls -la app/build/

      - uses: actions/upload-artifact@v4
        with:
          name: stack-${{ steps.b.outputs.ver }}
          path: |
            stack/app/build/*.fwsc
            stack/app/build/firmware.json

      # The web installer (fm1-base's tools/make_site.py): install/, emu/, firmware/ on GitHub Pages
      - name: Installer site
        run: |
          cd stack
          base/.venv/bin/python base/tools/build.py app --web
          base/.venv/bin/python base/tools/make_site.py app "app/build/stack-${{ steps.b.outputs.ver }}.fwsc" "${{ steps.b.outputs.ver }}" ../site
          ls -R ../site | head -40

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
